<nav class="navbar navbar-expand-lg nexo-navbar">
  <div class="container">
    <a class="navbar-brand nexo-brand" routerLink="/">
      <span>NEXO</span>
      <small>SETUP</small>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#nexoNavbar"
      aria-controls="nexoNavbar"
      aria-expanded="false"
      aria-label="Abrir navegación"
    >
      <i class="bi bi-list"></i>
    </button>

    <div class="collapse navbar-collapse" id="nexoNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active"> Productos </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/ofertas" routerLinkActive="active"> Ofertas </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/tienda" routerLinkActive="active"> Tienda </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active"> Contacto </a>
        </li>
      </ul>

      <div class="navbar-account">
        <ng-container *ngIf="usuario$ | async as usuario; else sesionInvitado">
          <div class="dropdown">
            <button
              class="account-trigger dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi bi-person-circle"></i>

              <span>
                {{ usuario.nombre }}
              </span>
            </button>

            <ul class="dropdown-menu dropdown-menu-end nexo-dropdown">
              <li>
                <div class="dropdown-user">
                  <strong>
                    {{ usuario.nombre }}
                  </strong>

                  <span>
                    {{ usuario.email }}
                  </span>
                </div>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <a class="dropdown-item" routerLink="/mi-cuenta">
                  <i class="bi bi-person"></i>
                  Mi Cuenta
                </a>
              </li>

              <li>
                <a class="dropdown-item" routerLink="/dashboard">
                  <i class="bi bi-grid"></i>
                  Dashboard
                </a>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <button class="dropdown-item logout-item" type="button" (click)="cerrarSesion()">
                  <i class="bi bi-box-arrow-right"></i>
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-template #sesionInvitado>
          <a routerLink="/mi-cuenta" class="account-link">
            <i class="bi bi-person"></i>
            Mi Cuenta
          </a>

          <a routerLink="/login" class="login-link"> Ingresar </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
