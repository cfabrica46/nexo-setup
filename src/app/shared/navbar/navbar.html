<nav class="navbar navbar-expand-lg nexo-navbar">
  <div class="container">
    <a class="navbar-brand nexo-brand" routerLink="/">
      <span>NEXO</span>
      <small>SETUP</small>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#nexoNavbar"
      aria-controls="nexoNavbar"
      aria-expanded="false"
      aria-label="Abrir navegación"
    >
      <i class="ph-bold ph-list"></i>
    </button>

    <div class="collapse navbar-collapse" id="nexoNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="ph-bold ph-house me-1"></i>Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">
            <i class="ph-bold ph-squares-four me-1"></i>Productos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/ofertas" routerLinkActive="active">
            <i class="ph-bold ph-tag me-1"></i>Ofertas
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/tienda" routerLinkActive="active">
            <i class="ph-bold ph-storefront me-1"></i>Tienda
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active">
            <i class="ph-bold ph-envelope-simple me-1"></i>Contacto
          </a>
        </li>
      </ul>

      <div class="navbar-account">
        <button
          type="button"
          class="theme-toggle"
          (click)="alternarTema()"
          [attr.aria-label]="(tema$ | async) === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
          [title]="(tema$ | async) === 'dark' ? 'Modo claro' : 'Modo oscuro'"
        >
          <i class="ph-bold" [ngClass]="(tema$ | async) === 'dark' ? 'ph-sun' : 'ph-moon-stars'"></i>
        </button>

        <a routerLink="/carrito" class="cart-link" aria-label="Carrito" title="Carrito">
          <i class="ph-bold ph-shopping-cart"></i>
          <span *ngIf="(cantidadCarrito$ | async) as cantidad" class="cart-count">{{ cantidad }}</span>
        </a>

        <ng-container *ngIf="usuario$ | async as usuario; else sesionInvitado">
          <div class="dropdown">
            <button
              class="account-trigger dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="ph-bold ph-user-circle"></i>

              <span>
                {{ usuario.nombre }}
              </span>
            </button>

            <ul class="dropdown-menu dropdown-menu-end nexo-dropdown">
              <li>
                <div class="dropdown-user">
                  <strong>
                    {{ usuario.nombre }}
                  </strong>

                  <span>
                    {{ usuario.email }}
                  </span>
                </div>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <a class="dropdown-item" routerLink="/mi-cuenta">
                  <i class="ph-bold ph-user"></i>
                  Mi Cuenta
                </a>
              </li>

              <li>
                <a class="dropdown-item" routerLink="/dashboard">
                  <i class="ph-bold ph-squares-four"></i>
                  Dashboard
                </a>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <button class="dropdown-item logout-item" type="button" (click)="cerrarSesion()">
                  <i class="ph-bold ph-sign-out"></i>
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <ng-template #sesionInvitado>
          <a routerLink="/mi-cuenta" class="account-link">
            <i class="ph-bold ph-user"></i>
            Mi Cuenta
          </a>

          <a routerLink="/login" class="login-link">
            <i class="ph-bold ph-sign-in"></i>
            Ingresar
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
